apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-processor
spec:
  replicas: 3 # Масштабируем для обработки больших батчей
  selector:
    matchLabels:
      app: content-processor
  template:
    metadata:
      labels:
        app: content-processor
    spec:
      containers:
        - name: content-processor
          image: your-docker-hub/content-processor:latest
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres_db:5432/kafka_db
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka_broker:9092
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082 # Предположим, порт этого модуля 8082