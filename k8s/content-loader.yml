apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-loader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-loader
  template:
    metadata:
      labels:
        app: content-loader
    spec:
      containers:
        - name: content-loader
          image: your-docker-hub/content-loader:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka-broker:9092
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: content-loader-service
spec:
  type: NodePort
  selector:
    app: content-loader
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081