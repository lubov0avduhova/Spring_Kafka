spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kafka_db?reWriteBatchedInserts=true
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true
        generate_statistics: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: price-history-new-v1
      auto-offset-reset: latest
      max-poll-records: 500
      fetch-min-size: 1048576
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "org.example.pricehistory.entity.EstateDto"
        spring.json.use.type.headers: false
    listener:
      type: batch

server:
  port: 8084

logging:
  level:
    org.hibernate.engine.jdbc.batch.internal.BatchingBatch: DEBUG
    org.apache.kafka.clients.producer.internals.Sender: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  kafka:
    topic:
      estate-processor: estate.loader.raw-data.v1